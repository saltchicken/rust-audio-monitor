[package]
name = "rust-audio-monitor"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.24.0", features = ["derive"] }
clap = { version = "4.5.50", features = ["derive"] }
pipewire = "0.9.2"

proclink = { git = "http://github.com/saltchicken/proclink", rev = "a5c1ae1" }

rustfft = { version = "6.4.1", optional = true }
num-complex = { version = "0.4.6", optional = true }

[lib]
name = "rust_audio_monitor_lib"
path = "src/lib.rs"

[[bin]]
name = "audio_monitor"
path = "src/main.rs"

[[bin]]
name = "audio_reader"
path = "src/bin/audio_reader.rs"

[[bin]]
name = "audio_reader_fft"
path = "src/bin/audio_reader_fft.rs"
required-features = ["rustfft", "num-complex"]
